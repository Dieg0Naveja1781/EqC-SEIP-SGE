<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>MiDrive | Login</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link rel="stylesheet" href="../Styles/App.css">

    <style>
        /* Posicionamiento del conmutador en la esquina */
        .theme-switcher-container {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 1000;
        }

        /* Estilos base del conmutador (toggle) */
        .theme-toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }

        /* Ocultar el checkbox real */
        .theme-toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        /* El deslizador (slider) */
        .theme-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc; /* Color en modo claro */
            transition: .4s;
            border-radius: 34px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5px;
            box-sizing: border-box;
        }

        /* El círculo deslizante (knob) */
        .theme-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
            z-index: 2;
        }

        /* Estilos cuando el checkbox está activado (Modo Oscuro) */
        .theme-toggle-switch input:checked + .theme-slider {
            background-color: var(--color-600); /* Color de tu paleta azul */
        }

        .theme-toggle-switch input:checked + .theme-slider:before {
            transform: translateX(30px);
        }

        /* Iconos dentro del deslizador */
        .theme-icon {
            font-size: 14px;
            z-index: 1;
            transition: .4s;
        }

        .sun-icon {
            color: #f1c40f; /* Amarillo sol */
            opacity: 1;
        }

        .moon-icon {
            color: #f1c40f; /* Amarillo luna */
            opacity: 0;
        }

        /* Cambiar opacidad de iconos según el estado */
        .theme-toggle-switch input:checked + .theme-slider .sun-icon {
            opacity: 0;
        }

        .theme-toggle-switch input:checked + .theme-slider .moon-icon {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function Login() {
            // Inicializamos en true para Modo Oscuro por defecto
            const [isDark, setIsDark] = React.useState(true);

            React.useEffect(() => {
                // Aplicar el tema al atributo data-theme del html
                document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            }, [isDark]);

            const handleSubmit = (e) => {
                e.preventDefault();
                console.log("Intento de inicio de sesión...");
            };

            return (
                <div className="login-page">
                    
                    {/* --- NUEVO CONMUTADOR DE TEMA ESTÉTICO --- */}
                    <div className="theme-switcher-container">
                        <label className="theme-toggle-switch">
                            <input 
                                type="checkbox" 
                                checked={isDark} 
                                onChange={() => setIsDark(!isDark)} 
                            />
                            <span className="theme-slider">
                                <span className="theme-icon sun-icon">☀️</span>
                                <span className="theme-icon moon-icon">🌙</span>
                            </span>
                        </label>
                    </div>

                    <div className="brand-section">
                        <div className="logo-box">LOGO</div>
                        <h1 style={{ color: 'var(--color-500)', margin: 0 }}>
                            MODIFICAR DESPUÉS {/* NOMBRE DEL SITIO */}
                        </h1>
                    </div>

                    <div className="login-card">
                        <h2 style={{ textAlign: 'center' }}>Iniciar Sesión</h2>
                        <form onSubmit={handleSubmit}>
                            <div className="input-group">
                                <label>Correo</label>
                                <input 
                                    type="email" 
                                    placeholder="ejemplo@algo.extension" 
                                    required 
                                />
                            </div>
                            <div className="input-group">
                                <label>Contraseña</label>
                                <input 
                                    type="password" 
                                    placeholder="••••••••" 
                                    required 
                                />
                            </div>
                            <button type="submit" className="btn-login">Entrar</button>
                        </form>
                        
                        <div className="footer-links" style={{ textAlign: 'center', marginTop: '1.5rem' }}>
                            <a href="#" style={{ color: 'var(--color-700)', textDecoration: 'none', fontSize: '0.9rem' }}>
                                ¿Olvidaste tu contraseña?
                            </a>
                            <p style={{ fontSize: '0.9rem', marginTop: '10px' }}>
                                ¿No tienes cuenta? <a href="#" style={{ color: 'var(--color-500)', fontWeight: 'bold', textDecoration: 'none' }}>Regístrate</a>
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Login />);
    </script>
</body>
</html>
